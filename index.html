<main class="app">
  <header>
    <h1>DTR Generator</h1>
    <p class="lede">Upload the biometric punch log. The first scan of each day becomes Time-In, the last becomes Time-Out, and the payroll sheet is built in your DTR layout.</p>
  </header>

  <div class="layout">
    <div class="rail">
      <section class="panel" aria-labelledby="h-up">
        <h2 class="eyebrow" id="h-up">Punch log</h2>
        <input class="vh" type="file" id="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        <label class="drop" id="drop" for="file">
          <strong>Choose the .xlsx file</strong>
          <span>or drop it here. Needs the Name and Date/Time columns.</span>
        </label>
        <p class="err" id="msg" role="alert" hidden></p>
        <button type="button" class="btn small" id="btnClear">Clear</button>
      </section>

      <section class="panel" aria-labelledby="h-opt">
        <h2 class="eyebrow" id="h-opt">Pay period and rules</h2>
        <div class="fields">
          <div class="field"><label for="optStart">From</label><input type="date" id="optStart"></div>
          <div class="field"><label for="optEnd">To</label><input type="date" id="optEnd"></div>
          <div class="field wide row">
            <button type="button" class="btn small" id="btnAuto">Auto cut-off</button>
            <button type="button" class="btn small" id="btnWhole">Whole file</button>
          </div>
          <div class="field"><label for="optDuty">Duty hours / day</label><input type="number" id="optDuty" value="8.5" step="0.25" min="0.25" max="24"></div>
          <div class="field"><label for="optRate">Rate / hour</label><input type="number" id="optRate" value="0" step="0.01" min="0"></div>
          <div class="field wide">
            <label class="check" for="optTrunc"><input type="checkbox" id="optTrunc" checked><span>Ignore seconds<small>3:03:58 PM counts as 3:03 PM.</small></span></label>
          </div>
          <div class="field wide">
            <label class="check" for="optNight"><input type="checkbox" id="optNight"><span>Shifts can end after midnight<small>Early-morning scans count toward the previous day.</small></span></label>
          </div>
          <div class="field wide" id="cutWrap" hidden>
            <label for="optCut">Scans before this time belong to the previous day</label>
            <select id="optCut"><option value="6">6:00 AM</option><option value="8">8:00 AM</option><option value="10" selected>10:00 AM</option><option value="12">12:00 PM</option></select>
          </div>
        </div>
      </section>
    </div>

    <section class="result" aria-label="Preview">
      <p class="source" id="source"></p>
      <div class="tabs" id="tabs" role="tablist" aria-label="Employees" hidden></div>
      <div class="namebar">
        <label for="nameInput">Name on sheet</label>
        <input type="text" id="nameInput" autocomplete="off" spellcheck="false">
      </div>
      <dl class="stats" id="stats"></dl>
      <ul class="flags" id="flags"></ul>
      <div class="sheetwrap" id="sheetwrap"></div>
      <div class="actions">
        <button type="button" class="btn primary" id="btnDownload">Download .xlsx</button>
        <p class="hint" id="dlHint"></p>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/* DTR core: parse a biometric punch log, compute daily time records, write the payroll workbook. */
(function (root) {
  'use strict';

  var DAY = 86400;
  var MIN_SHIFT_SEC = 30 * 60; // scans closer than this count as one scan (missing time-out)
  var DUTY_DEFAULT = 8.5;
  var ACC = '_(* #,##0.00_);_(* \\(#,##0.00\\);_(* "-"??_);_(@_)';
  var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  function pad(n) { return String(n).padStart(2, '0'); }
  function dayKey(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
  function keyToUTC(key) { var p = key.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function utcToKey(ms) { var d = new Date(ms); return dayKey(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
  function addDays(key, n) { return utcToKey(keyToUTC(key) + n * 86400000); }
  function weekday(key) { return new Date(keyToUTC(key)).getUTCDay(); }
  function fmtUS(key) { var p = key.split('-'); return p[1] + '/' + p[2] + '/' + p[0]; }

  /* ---------- reading the log ---------- */

  function cellText(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'number') return String(v);
    if (v instanceof Date) return '';
    if (v.richText) return v.richText.map(function (t) { return t.text; }).join('');
    if (v.result != null) return cellText(v.result);
    if (v.text != null) return String(v.text);
    return '';
  }

  function parseStamp(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'object' && !(v instanceof Date)) {
      if (v.result != null) return parseStamp(v.result);
      var t = cellText(v);
      return t ? parseStamp(t) : null;
    }
    if (typeof v === 'number') {
      if (v < 20000) return null;
      v = new Date(Math.round((v - 25569) * DAY) * 1000);
    }
    if (v instanceof Date) {
      if (isNaN(v.getTime())) return null;
      return {
        key: dayKey(v.getUTCFullYear(), v.getUTCMonth() + 1, v.getUTCDate()),
        sec: v.getUTCHours() * 3600 + v.getUTCMinutes() * 60 + v.getUTCSeconds()
      };
    }
    var s = String(v).trim();
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?/.exec(s), y, mo, d, h, mi, se, ap;
    if (m) {
      mo = +m[1]; d = +m[2];
      if (mo > 12 && d <= 12) { var tmp = mo; mo = d; d = tmp; }
      y = +m[3]; h = +m[4]; mi = +m[5]; se = +(m[6] || 0); ap = m[7];
    } else {
      m = /^(\d{4})-(\d{2})-(\d{2})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?/.exec(s);
      if (!m) return null;
      y = +m[1]; mo = +m[2]; d = +m[3]; h = +m[4]; mi = +m[5]; se = +(m[6] || 0); ap = m[7];
    }
    if (ap) h = (h % 12) + (/p/i.test(ap) ? 12 : 0);
    if (mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || mi > 59 || se > 59) return null;
    return { key: dayKey(y, mo, d), sec: h * 3600 + mi * 60 + se };
  }

  var DT_HEADERS = ['date/time', 'datetime', 'date time', 'timestamp', 'punch time', 'check time'];

  async function readLog(buffer) {
    var wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buffer);
    var punches = [], skipped = 0;
    wb.eachSheet(function (ws) {
      var hdr = -1, nameCol = -1, dtCol = -1;
      ws.eachRow({ includeEmpty: false }, function (row, rn) {
        if (hdr > 0 || rn > 20) return;
        var n = -1, d = -1;
        row.eachCell(function (cell, cn) {
          var t = cellText(cell.value).trim().toLowerCase();
          if (t === 'name') n = cn;
          if (DT_HEADERS.indexOf(t) >= 0) d = cn;
        });
        if (n > 0 && d > 0) { hdr = rn; nameCol = n; dtCol = d; }
      });
      if (hdr < 0) { hdr = 1; nameCol = 2; dtCol = 4; } // typical export layout
      ws.eachRow({ includeEmpty: false }, function (row, rn) {
        if (rn <= hdr) return;
        var name = cellText(row.getCell(nameCol).value).replace(/\s+/g, ' ').trim();
        var st = parseStamp(row.getCell(dtCol).value);
        if (!name || !st) { skipped++; return; }
        punches.push({ name: name, key: st.key, sec: st.sec });
      });
    });
    return { punches: punches, skipped: skipped };

  ['optStart', 'optEnd', 'optDuty', 'optRate', 'optTrunc'].forEach(function (id) { $(id).addEventListener('input', function () { renderSheet(); }); });
  ['optNight', 'optCut'].forEach(function (id) {
    $(id).addEventListener('change', function () { $('cutWrap').hidden = !$('optNight').checked; regroup(); render(); });
  });
  $('btnAuto').addEventListener('click', function () { setPeriod(D.detectPeriod(state.punches)); renderSheet(); });
  $('btnWhole').addEventListener('click', function () { setPeriod(D.fullRange(state.punches)); renderSheet(); });
  $('nameInput').addEventListener('input', function (ev) {
    var e = state.employees[state.active]; if (!e) return;
    e.name = ev.target.value.toUpperCase(); state.names[e.id] = e.name;
    ev.target.value = e.name; renderTabs(); renderSheet();
  });
  $('btnDownload').addEventListener('click', download);
  $('btnClear').addEventListener('click', clearAll);

  load(exampleLog(), { source: 'example' });
})();

</script>

</body></html>
